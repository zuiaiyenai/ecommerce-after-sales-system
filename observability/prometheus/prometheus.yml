global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecommerce-java
    metrics_path: /api/actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/agent-token
    static_configs:
      - targets: ["java:8080"]
        labels:
          component: java-backend

  - job_name: ecommerce-python-agent
    metrics_path: /api/metrics/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/agent-token
    static_configs:
      - targets: ["agent:8000"]
        labels:
          component: python-agent
