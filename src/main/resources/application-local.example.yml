spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/ecommerce_aftersales?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:local-dev-password}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}

pgvector:
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/after_sales_rag}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:local-dev-password}

app:
  knowledge:
    # Java is the upload boundary and enforces this limit.
    max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:10485760}
  rag:
    # Keep the layered retriever disabled until migration, backfill and offline gates pass.
    layered-retrieval-enabled: ${RAG_LAYERED_RETRIEVAL_ENABLED:false}
  async:
    knowledge-ingestion:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
  security:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
  jwt:
    secret: "change-this-secret-key-to-at-least-32-bytes-in-production"
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000/api}
    # 多副本时填写多个 Agent 地址；每个副本应绑定独立 GPU/推理服务。
    # base-urls:
    #   - http://10.0.0.11:8000/api
    #   - http://10.0.0.12:8000/api
    internal-token: ${AGENT_INTERNAL_TOKEN:replace-with-a-random-shared-secret}
    # 0 时按“副本数 × 单副本并发”自动计算网关容量。
    max-concurrent-requests: 0
    per-instance-max-concurrent-requests: 2
    queue-wait-millis: 200
