server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    mbeanregistry:
      enabled: true
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: ecommerce-aftersales
  config:
    import: optional:classpath:application-local.yml,optional:file:./agent.local.properties
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_MAX_FILE_BYTES:10485760}
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/ecommerce_aftersales?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:local-dev-password}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:10}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:30000}
  messages:
    encoding: UTF-8
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

pgvector:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/after_sales_rag}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:}
    hikari:
      maximum-pool-size: ${PGVECTOR_MAX_POOL_SIZE:5}
      minimum-idle: ${PGVECTOR_MIN_IDLE:1}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  observability:
    prometheus-base-url: ${PROMETHEUS_BASE_URL:http://127.0.0.1:9090}
    prometheus-timeout: ${PROMETHEUS_TIMEOUT:2s}
    grafana-agent-url: ${GRAFANA_AGENT_URL:http://localhost:3000/d/ecommerce-agent-overview/ecommerce-after-sales-agent-overview}
  async:
    knowledge-ingestion:
      core-pool-size: ${KNOWLEDGE_INGEST_CORE_POOL_SIZE:2}
      max-pool-size: ${KNOWLEDGE_INGEST_MAX_POOL_SIZE:4}
      queue-capacity: ${KNOWLEDGE_INGEST_QUEUE_CAPACITY:100}
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: "${JWT_SECRET:change-this-secret-key-to-at-least-32-bytes-in-production}"
    expire-minutes: 10080
  upload:
    dir: ./uploads
  knowledge:
    max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:10485760}
  rag:
    layered-retrieval-enabled: ${RAG_LAYERED_RETRIEVAL_ENABLED:false}
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000/api}
    base-urls: ${AGENT_BASE_URLS:}
    timeout-millis: ${AGENT_TIMEOUT_MILLIS:90000}
    auto-start: ${AGENT_AUTO_START:false}
    python-command: ${AGENT_PYTHON_COMMAND:python}
    launch-args:
      - -m
      - after_sales_agent.interface.http_server
    script-path: ${AGENT_SCRIPT_PATH:}
    working-directory: ${AGENT_WORKING_DIRECTORY:python_agent}
    startup-wait-millis: ${AGENT_STARTUP_WAIT_MILLIS:15000}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    max-concurrent-requests: ${AGENT_MAX_CONCURRENT_REQUESTS:0}
    per-instance-max-concurrent-requests: ${AGENT_PER_INSTANCE_MAX_CONCURRENT_REQUESTS:2}
    queue-wait-millis: ${AGENT_QUEUE_WAIT_MILLIS:200}
    review:
      minimum-confidence: ${AGENT_REVIEW_MINIMUM_CONFIDENCE:0.75}
  after-sales:
    review-status-cache:
      ttl-seconds: ${AFTER_SALES_REVIEW_STATUS_CACHE_TTL_SECONDS:1800}
    review-events:
      topic: ${AFTER_SALES_REVIEW_TOPIC:after_sales.review.request}
      max-retries: ${AFTER_SALES_REVIEW_EVENT_MAX_RETRIES:5}
      batch-size: ${AFTER_SALES_REVIEW_EVENT_BATCH_SIZE:20}
      publish-fixed-delay-ms: ${AFTER_SALES_REVIEW_EVENT_PUBLISH_DELAY_MS:3000}
  rate-limit:
    after-sales-submit:
      enabled: ${RATE_LIMIT_AFTER_SALES_SUBMIT_ENABLED:true}
      limit: ${RATE_LIMIT_AFTER_SALES_SUBMIT_LIMIT:5}
      window-seconds: ${RATE_LIMIT_AFTER_SALES_SUBMIT_WINDOW_SECONDS:60}
    ai-chat:
      enabled: ${RATE_LIMIT_AI_CHAT_ENABLED:true}
      limit: ${RATE_LIMIT_AI_CHAT_LIMIT:30}
      window-seconds: ${RATE_LIMIT_AI_CHAT_WINDOW_SECONDS:60}
  miniapp:
    client:
      environment-code: ${MINIAPP_ENV_CODE:local}
      environment-label: ${MINIAPP_ENV_LABEL:本机开发环境}
      api-path: /api
      request-timeout-millis: 15000
      agent-request-timeout-millis: ${MINIAPP_AGENT_REQUEST_TIMEOUT_MILLIS:330000}
      presets:
        - code: lan
          label: 当前局域网调试
          base-origin: ${MINIAPP_LAN_BASE_ORIGIN:http://10.242.0.150:8080}
          recommended: true
      demo-user:
        enabled: true
        phone: 13800138000
        password: 123456
        nickname: 演示用户
